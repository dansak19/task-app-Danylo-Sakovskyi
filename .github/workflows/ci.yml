name: Test and Scan
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - shell: bash
        run: pytest -ra services/${{ matrix.service }} | tee ${{ matrix.service }}-test-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-test-report
          path: ${{ matrix.service }}-test-report.txt
