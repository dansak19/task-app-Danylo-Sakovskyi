name: Test and Scan
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/tasks-api/requirements.txt
      - run: pytest services/tasks-api
